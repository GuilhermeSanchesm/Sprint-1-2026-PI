<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulador Financeiro</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="../assets/logo-icon.png" type="image/x-icon">
</head>

<body>
  <main>
    <img src="../assets/zymos-logo-branca.png" alt="logo Zymos">
    <div class="main-container">
      <h1>Simulador Financeiro</h1>

      <!-- Campos 1 e 2 -->
      <div class="row-1">
        <div class="main-content">
          <label>
            Produção de cerveja anual (litros)
            <b>*</b>
          </label>
          <input type="number" id="iptLitros" placeholder="Ex: 5000" />
        </div>

        <div class="main-content">
          <label>
            Custo de produção por litro (R$)
            <b>*</b>
          </label>
          <input type="number" id="iptCustoProducao" placeholder="Ex: R$ 1.50" />
        </div>
      </div>

      <!-- Campos 3 e 4 -->
      <div class="row-2">
        <div class="main-content">
          <label>
            Preço de venda por litro (R$)
            <b>*</b>
          </label>
          <input type="number" id="iptPrecoLitro" placeholder="Ex: R$ 15.00" />
        </div>

        <div class="main-content">
          <label>
            Volume anual descartado por falha térmica (litros)
          </label>
          <input type="number" id="iptDesperdicio" placeholder="Ex: 250" />
          <span class="main-content-aviso">Na ausência do dado, será usado o desperdício aproximado de 5%</span>
        </div>
      </div>

      <!-- Campo 5 -->
      <div class="main-content">
        <label>
          Tipo de produção
          <b>*</b>
        </label>
        <select id="sltTipoCerveja">
          <option value="">Selecione</option>
          <option value="Ale">Ale</option>
          <option value="Lager">Lager</option>
        </select>
      </div>

      <!-- Botão para acionar a função -->
      <button onclick="simular()">Simular</button>
      <div>
        <div id="exibirCenario"></div>
      </div>
    </div>

    <div class="ref">
      <p>Referências: Essa simulação foi baseada nas pesquisas do Journal of Institute of Brewing, Alfa Laval e Craft Beer Professionals.</p>
    </div>

  </main>
</body>

</html>
<script>
    // Declaração da Função
  function simular() {

    // Declaração das variáveis locais
    let taxaDesperdicioPadrao = 0.05;

    let producaoLitros = Number(iptLitros.value);
    let producaoDesperdicio = Number(iptDesperdicio.value);
    let precoLitro = Number(iptPrecoLitro.value);
    let custoProducao = Number(iptCustoProducao.value);
    let tipoCerveja = sltTipoCerveja.value;

    // Verificação de campos preenchidos
    if (tipoCerveja == "") {
      alert("Selecione o tipo da produção");
    } else if (producaoLitros == "") {
      alert("Insira o valor da produção");
    } else if (precoLitro == "") {
      alert("Insira o valor de venda por litro");
    } else if (custoProducao == "") {
      alert("Insira o custo de produção");
    } else {

      let litrosDesperdiciados = 0;

      if (producaoDesperdicio > 0) {
        litrosDesperdiciados = producaoDesperdicio;
      } else {
        litrosDesperdiciados = producaoLitros * taxaDesperdicioPadrao;
      }

      // Operações aritméticas
      let dinheiroPerdido = (litrosDesperdiciados * precoLitro).toFixed(2); // Qtd. de dinheiro perdido
      let dinheiroProducao = (custoProducao * litrosDesperdiciados).toFixed(2); // Qtd. de dinheiro perdido na produção
      let porcentagemPerda = ((litrosDesperdiciados / producaoLitros) * 100).toFixed(1); // Porcentagem de perda em relação a produção total

      // Atribuição de saídas para os Cards
      let cenarioEmpresa = `
      <div class="span-container">
        <div class="card">
          <span class="mensagem-destaque">${litrosDesperdiciados} L</span> <p>desperdiçados</p>
        </div> 

      <div class="card">
        <span class="mensagem-destaque">${porcentagemPerda}%</span>
          <p>da produção perdida</p></div>
        <div class="card">

      <span class="mensagem-destaque">R$ ${dinheiroProducao}</span>
      <p>gasto em produção perdida</p></div>
      <div class="card">
      <span class="mensagem-destaque">R$ ${dinheiroPerdido}</span>
      <p>prejuízo em vendas</p></div></div> 

      <div class="card-mensagem">
      A fermentação é a fase mais crítica da sua produção: pequenas oscilações térmicas invisíveis estressam a levedura e estragam o lote. No seu cenário atual, sua empresa de fabricação de cerveja do tipo <span class = "destaque-positivo">${tipoCerveja}</span> possui um 
     <span class="destaque-negativo">desperdício</span> de 
     <span class="mensagem-destaque">${litrosDesperdiciados} litro(s)</span>, o que representa 
     <span class="mensagem-destaque">${porcentagemPerda}%</span> da sua <span class="destaque-negativo">perda total</span>. 
     Isso equivale a uma <span class="destaque-negativo">perda direta de produção</span> de <span class="mensagem-destaque">R$${dinheiroProducao}</span> 
     e um potencial de receita <span class="destaque-negativo">não</span> realizado de <span class="mensagem-destaque">R$${dinheiroPerdido}</span>. <br><br>
     Com a Zymos, sua empresa tem <span class = "destaque-positivo">consciência </span> das oscilações térmicas na etapa de fermentação e pode 
     <span class = "destaque-positivo"> intervir </span> antes que ocorra o prejuízo financeiro.
     </div><br>

     <div class = "card-contato">
     <p>Estes valores te <span class="destaque-palavra">incomodam</span>?</p><br>
     <button>Entre em contato</button> </div>`; // Atribuição de saídas texto

      exibirCenario.innerHTML = cenarioEmpresa;
    }
  };

</script>
