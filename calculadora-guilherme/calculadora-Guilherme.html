<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zymos Simulador Financeiro</title>
</head>

<body>
    <h1>Simulador Financeiro para cervejarias</h1>

    <p>Qual nicho de cerveja você produz?</p>
    <select id="tipo_cerveja">
        <option value="0">Selecionar...</option>
        <option value="Ale">Ale</option>
        <option value="Lager">Lager</option>
    </select>
    <br>
    <p>Vamos iniciar a sua simulação? Para isso preencha os campos abaixo:</p>
    <p>Quantidade de produção de cerveja anual (litros):<input type="text" id="ipt_qtd_litros_anuais"placeholder="Digite aqui, ex: 100.000"></p>
    <p>Valor do seu litro vendido (R$):<input type="text" id="ipt_qtd_valor_litro" placeholder="Digite aqui, ex: 8.00"></p>
    <p>Seu custo de produção por litro (R$) - essa pergunta é opcional:<input type="text" id="ipt_custo"
            placeholder="Digite aqui, ex: 1.60"></p>

    <button onclick="simular()">Fazer Simulação</button>
    <div id="resultado"></div>

</body>

<script>
    function simular() {
        // Declaração das variáveis a partir dos valores dos INPUTS
        let qtd_litros_anual = Number(ipt_qtd_litros_anuais.value);
        let tipoCerveja = tipo_cerveja.value;
        let valor_litro = 0;
        let custo_producao = 0;

        // verifica se os campos estão devidamente preenchidos
        if (ipt_qtd_litros_anuais.value.length == 0 || tipoCerveja == "0") {
            resultado.innerHTML = "<br> Há campos obrigatórios em branco. Por favor, preencha-os!";
        } else {
            let desperdicio_fixo = 0.05;
            let litros_perdidos = qtd_litros_anual * desperdicio_fixo;

            // custo na produção (caso não inserido é atribuído um valor padrão)
            if (ipt_custo.value.length == 0 && tipoCerveja == 'Lager') {
                custo_producao = 2.5;  // custos baseados no BeerCast
            } else if (ipt_custo.value.length == 0 && tipoCerveja == 'Ale') {
                custo_producao = 2.0;
            } else {
                custo_producao = Number(ipt_custo.value);
            }

            // Validar valor do litro (caso não inserido é atribuido um valor padrão)
            if (ipt_qtd_valor_litro.value.length == 0 && tipoCerveja == 'Lager') {
                valor_litro = 7;                                // Valores comerciais das bebidas desse tipo
            } else if (ipt_qtd_valor_litro.value.length == 0 && tipoCerveja == 'Ale') {
                valor_litro = 8;
            } else {
                valor_litro = Number(ipt_qtd_valor_litro.value);
            }

            let valor_investido_producao = custo_producao * qtd_litros_anual;
            let valor_perdido_producao = litros_perdidos * custo_producao;
            let faturamento_perdido = litros_perdidos * valor_litro;
            let valor_ganhos_total = qtd_litros_anual * valor_litro;

            // Exibição do resultado
            resultado.innerHTML = `<br> Anualmente, você investe R$${valor_investido_producao.toFixed(2)} na sua produção de cerveja ${tipoCerveja}.<br> 
            Devido ao desperdício médio de 5% por falha de monitoramento, você perde cerca de <b>${litros_perdidos.toFixed(0)} litros</b> ao ano.<br>
            Valor perdido na produção: R$${valor_perdido_producao.toFixed(2)}<br>
            Faturamento total perdido: R$${faturamento_perdido.toFixed(2)}<br>
            Seu faturamento poderia ser de R$${(valor_ganhos_total * 0.98).toFixed(2)}.`;
        }
    }
</script>

</html>
